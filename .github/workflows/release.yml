name: Release

on:
  push:
    tags: ['v*.*.*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build, screenshot, publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential \
            libgl1-mesa-dev libglu1-mesa-dev \
            freeglut3-dev \
            xvfb imagemagick

      - name: Build
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel

      - name: Render screenshot scenarios
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 1
          TAG="${GITHUB_REF_NAME}"
          mkdir -p "screenshots/latest" "screenshots/$TAG"
          for i in 0 1 2; do
            DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 ./build/mpg_projekt --ci-scenario $i
            test -s "ci_shot_${i}.bmp"
            convert "ci_shot_${i}.bmp" "screenshots/latest/scene_${i}.webp"
            cp "screenshots/latest/scene_${i}.webp" "screenshots/${TAG}/scene_${i}.webp"
            rm "ci_shot_${i}.bmp"
          done

      - name: Update README screenshot section
        run: |
          TAG="${GITHUB_REF_NAME}"
          python3 - "$TAG" <<'EOF'
          import sys, re, pathlib
          tag = sys.argv[1]
          readme = pathlib.Path("README.md")
          text = readme.read_text()

          # ── latest block: three full-width images stacked vertically ────
          latest = (
              "<!-- SCREENSHOTS_START -->\n"
              f"### Latest — {tag}\n\n"
              "![scene0](screenshots/latest/scene_0.webp)\n\n"
              "![scene1](screenshots/latest/scene_1.webp)\n\n"
              "![scene2](screenshots/latest/scene_2.webp)\n\n"
              "<!-- SCREENSHOTS_END -->"
          )
          text = re.sub(
              r"<!-- SCREENSHOTS_START -->.*?<!-- SCREENSHOTS_END -->",
              latest, text, flags=re.DOTALL
          )

          # ── history table: one row per version, three thumbnails per row ─
          new_row = (
              f"| [{tag}](screenshots/{tag}/) "
              f"| <img src=\"screenshots/{tag}/scene_0.webp\" width=\"200\"> "
              f"| <img src=\"screenshots/{tag}/scene_1.webp\" width=\"200\"> "
              f"| <img src=\"screenshots/{tag}/scene_2.webp\" width=\"200\"> |"
          )
          header = (
              "<!-- HISTORY_START -->\n"
              "| Version | Scene 0 | Scene 1 | Scene 2 |\n"
              "|---------|---------|---------|---------|"
          )
          text = text.replace(
              header,
              header + "\n" + new_row,
              1
          )

          readme.write_text(text)
          EOF

      - name: Commit screenshots, README and VERSION
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "$VERSION" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screenshots/ README.md VERSION
          git diff --staged --quiet || \
            git commit -m "chore(ci): screenshots for $TAG [skip ci]"
          git push origin HEAD:main

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            screenshots/latest/scene_0.webp \
            screenshots/latest/scene_1.webp \
            screenshots/latest/scene_2.webp \
            --title "Night Park $TAG" \
            --notes "Automated render of 3 scene viewpoints."
